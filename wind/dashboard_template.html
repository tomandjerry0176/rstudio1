<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --caution: #b8b7af;
  --up: #2a78d6;
  --down: #e34948;
  --chip: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --wash: rgba(255,255,255,0.05);
    --series-1: #3987e5;
    --series-2: #d95926;
    --caution: #5d5c57;
    --up: #3987e5;
    --down: #e66767;
    --chip: #2c2c2a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --wash: rgba(255,255,255,0.05);
  --series-1: #3987e5;
  --series-2: #d95926;
  --caution: #5d5c57;
  --up: #3987e5;
  --down: #e66767;
  --chip: #2c2c2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.meta { color: var(--ink-2); font-size: 13px; margin: 0; }
.meta span + span::before { content: "·"; margin: 0 6px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 600; margin: 2px 0; letter-spacing: -0.01em; }
.tile .sub { color: var(--muted); font-size: 12px; }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0; }
.panel .hint { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px;
  padding: 3px 10px; border-radius: 6px; cursor: pointer;
}
.seg button.active { background: var(--chip); color: var(--ink); font-weight: 600; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--ink-2); font-size: 12px; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .val { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .hit { fill: transparent; cursor: pointer; }
svg .hit:hover { fill: var(--wash); }

.table-panel { margin-top: 12px; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
thead th { color: var(--ink-2); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
thead th:hover { color: var(--ink); }
thead th.sorted { color: var(--ink); font-weight: 600; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover, tbody tr.row.open { background: var(--wash); }
td.name { font-weight: 600; }
td.name .caret { display: inline-block; width: 12px; color: var(--muted); font-weight: 400; }
td.na { color: var(--muted); }
.chip { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--ink-2); margin-right: 4px; }
tr.detail > td { background: var(--wash); padding: 12px 14px 16px; text-align: left; white-space: normal; }
.detail-facts { color: var(--ink-2); margin: 0 0 8px; }
.detail-facts b { color: var(--ink); font-weight: 600; }
.detail table { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.detail th { position: static; cursor: default; }

details.notes { margin-top: 12px; color: var(--ink-2); font-size: 12px; }
details.notes summary { cursor: pointer; color: var(--ink); font-size: 13px; }
details.notes ol { padding-left: 20px; margin: 8px 0 0; }

#tip {
  position: fixed; pointer-events: none; z-index: 10; display: none; max-width: 280px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
#tip b { display: block; font-size: 13px; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
#tip .r span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .tile .value { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="charts">
    <article class="panel">
      <div class="panel-head">
        <div>
          <h2 id="growthTitle"></h2>
          <p class="hint">共同样本合计利润增速；超出坐标范围的条形截断并标注实际值</p>
        </div>
      </div>
      <div class="legend">
        <span><i style="background:var(--series-1)"></i>行业合计增速</span>
        <span><i style="background:var(--caution)"></i>受扭亏 / 小样本 / 一次性因素影响，谨慎比较</span>
        <span><i class="dot" style="background:var(--series-2)"></i>个股增速中位数</span>
      </div>
      <div id="growthChart"></div>
    </article>

    <article class="panel">
      <div class="panel-head">
        <div>
          <h2 id="revTitle"></h2>
          <p class="hint" id="revHint"></p>
        </div>
        <div class="seg" id="revSwitch"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--up)"></i>上调</span>
        <span><i style="background:var(--down)"></i>下调</span>
      </div>
      <div id="revChart"></div>
    </article>
  </section>

  <section class="panel table-panel">
    <div class="panel-head">
      <div>
        <h2>行业明细</h2>
        <p class="hint">点击表头排序；点击行业展开增量贡献最大的公司</p>
      </div>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
    <details class="notes">
      <summary>统计说明</summary>
      <ol id="notes"></ol>
    </details>
  </section>
</div>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
if (!DATA) {
  // 直接打开模板：这里没有数据，提示改开生成后的看板文件
  document.querySelector(".wrap").innerHTML = `<section class="panel" style="margin-top:24px">
    <h2>这是看板模板，本身不含数据</h2>
    <p class="hint" style="font-size:14px;line-height:1.8;color:var(--ink-2)">
      请打开脚本生成的看板文件，例如：<br>
      · 申万一级_2027盈利预期_latest.html<br>
      · 港股_恒生一级_2027盈利预期_latest.html / 港股_Wind二级_2027盈利预期_latest.html<br>
      它们由 sw1_consensus_2027.py / hk_consensus_2027.py 运行结束时自动生成，与 Excel 在同一目录。<br>
      也可以从已有 Excel 单独生成：python build_dashboard.py 某某.xlsx
    </p></section>`;
  throw new Error("dashboard_template.html 是模板，请打开生成后的看板文件");
}
const FY = DATA.forecastYear, BY = DATA.baseYear, W = DATA.windows;
let revWindow = W[0];
let sortKey = "g", sortDir = -1;
const openRows = new Set();

const CAUTION_FLAGS = ["扭亏驱动", "基期亏损", "小样本", "基期含一次性"];
const isCaution = d => d.flags.some(f => CAUTION_FLAGS.includes(f));

const zeroSafe = (v, digits) => Math.abs(v * 100) < 0.5 * Math.pow(10, -digits) ? 0 : v;
const fmtPct = (v, digits = 1) => v == null ? "—" : (zeroSafe(v, digits) * 100).toFixed(digits) + "%";
const fmtSignedPct = (v, digits = 1) => {
  if (v == null) return "—";
  const z = zeroSafe(v, digits);
  return (z > 0 ? "+" : "") + (z * 100).toFixed(digits) + "%";
};
const fmtNum = (v, digits = 0) => v == null ? "—" : v.toLocaleString("zh-CN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtX = v => v == null ? "—" : v.toFixed(1) + "x";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- header & tiles ---------- */
function renderHeader() {
  document.getElementById("title").textContent = `${DATA.title} · ${FY}E 盈利一致预期`;
  const dates = W.map(w => `${w}前 ${DATA.windowDates[w] || "—"}`).join("，");
  document.getElementById("meta").innerHTML =
    `<span>数据日期 ${esc(DATA.date)}</span><span>Wind 一致预期（180 天）</span>${DATA.currency ? `<span>金额单位：亿${esc(DATA.currency)}</span>` : ""}<span>修正对比：${esc(dates)}</span>`;
  document.getElementById("growthTitle").textContent = `${FY}E 盈利增速`;
  document.getElementById("revTitle").textContent = `${FY}E 盈利预期修正`;

  const o = DATA.overall;
  const rev = DATA.industries.map(d => d.rev[W[0]] && d.rev[W[0]].r).filter(v => v != null);
  const tiles = [
    { label: `全部有预测公司 · ${FY}E 增速`, value: fmtSignedPct(o.g),
      sub: `${fmtNum(o.np0)} → ${fmtNum(o.np1)} 亿${DATA.currency || "元"}（共同样本）` },
    { label: `全部有预测公司 · ${FY}E PE`, value: fmtX(o.pe),
      sub: `${fmtNum(o.nf)} / ${fmtNum(o.stocks)} 家有 ${FY} 预测` },
    { label: `${FY}E 预期修正 · ${W[0]}`, value: fmtSignedPct(o.rev[W[0]]),
      sub: W.slice(1).map(w => `${w} ${fmtSignedPct(o.rev[w])}`).join("，") || "配对样本" },
    { label: `${W[0]}内上调的行业`, value: `${rev.filter(v => v > 0).length} / ${rev.length}`,
      sub: `下调 ${rev.filter(v => v < 0).length} 个` },
  ];
  document.getElementById("tiles").innerHTML = tiles.map(t =>
    `<div class="tile"><div class="label">${esc(t.label)}</div><div class="value">${t.value}</div><div class="sub">${esc(t.sub)}</div></div>`
  ).join("");
}

/* ---------- shared bar-chart helpers ---------- */
const ROW = 22, BAR = 12, LABEL_W = 70, TOP = 22, RIGHT = 44;

function niceTicks(min, max, count = 5) {
  const span = max - min || 1;
  const step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || 10 * mag;
  const ticks = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

/* horizontal bar path with 4px radius on the data end only */
function barPath(x0, x1, y, h) {
  const r = Math.min(4, Math.abs(x1 - x0) / 2, h / 2);
  if (Math.abs(x1 - x0) < 0.5) return "";
  if (x1 >= x0) {
    return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
  }
  return `M${x0},${y}H${x1 + r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 + r},${y + h}H${x0}Z`;
}

function axis(svg, scale, ticks, height, fmt) {
  let s = "";
  for (const t of ticks) {
    const x = scale(t);
    s += `<line x1="${x}" x2="${x}" y1="${TOP - 4}" y2="${height}" stroke="${t === 0 ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/>`;
    s += `<text class="tick" x="${x}" y="${TOP - 8}" text-anchor="middle">${fmt(t)}</text>`;
  }
  return s;
}

function sizeOf(el) { return Math.max(280, el.clientWidth); }

/* ---------- growth chart ---------- */
function renderGrowth() {
  const el = document.getElementById("growthChart");
  const width = sizeOf(el);
  const rows = [...DATA.industries].sort((a, b) => (b.g ?? -Infinity) - (a.g ?? -Infinity));
  const vals = rows.flatMap(d => [d.g, d.gmed]).filter(v => v != null);
  const sorted = vals.filter(v => v > 0).sort((a, b) => a - b);
  // cap the axis so one turnaround outlier cannot flatten the rest
  const p90 = sorted[Math.floor(sorted.length * 0.9)] ?? 0.5;
  let max = Math.max(...vals);
  if (max > p90 * 2.5) max = Math.min(max, Math.max(1, Math.ceil(p90 * 1.4 * 10) / 10));
  const min = Math.min(0, ...vals);
  const ticks = niceTicks(min, max);
  const lo = Math.min(min, ticks[0]), hi = Math.max(max, ticks[ticks.length - 1]);
  const x = v => LABEL_W + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (width - LABEL_W - RIGHT);
  const height = TOP + rows.length * ROW + 4;

  let s = axis(null, x, ticks, height, t => (t * 100).toFixed(0) + "%");
  rows.forEach((d, i) => {
    const y = TOP + i * ROW, by = y + (ROW - BAR) / 2;
    s += `<text x="${LABEL_W - 8}" y="${y + ROW / 2 + 4}" text-anchor="end">${esc(d.name)}</text>`;
    if (d.g == null) {
      const tx = Math.max(x(0), d.gmed == null ? 0 : x(d.gmed)) + 8;
      s += `<text class="val" x="${tx}" y="${y + ROW / 2 + 4}">${d.flags.includes("基期亏损") ? "基期亏损，增速不适用" : "—"}</text>`;
    } else {
      const fill = isCaution(d) ? "var(--caution)" : "var(--series-1)";
      s += `<path d="${barPath(x(0), x(d.g), by, BAR)}" fill="${fill}"/>`;
      if (d.g > hi) {
        const bx = x(hi);
        s += `<path d="M${bx - 10},${by + BAR + 2}L${bx - 6},${by - 2}M${bx - 5},${by + BAR + 2}L${bx - 1},${by - 2}" stroke="var(--surface)" stroke-width="2"/>`;
        s += `<text class="val" x="${bx + 4}" y="${y + ROW / 2 + 4}">${fmtPct(d.g, 0)}</text>`;
      }
    }
    if (d.gmed != null) {
      s += `<circle cx="${x(d.gmed)}" cy="${y + ROW / 2}" r="4" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/>`;
    }
    s += `<rect class="hit" data-i="${d.name}" x="0" y="${y}" width="${width}" height="${ROW}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" height="${height}" role="img" aria-label="${FY}E 各行业盈利增速">${s}</svg>`;
  bindHover(el, name => {
    const d = DATA.industries.find(r => r.name === name);
    return tipHtml(d.name + (d.flags.length ? `（${d.flags.join("、")}）` : ""), [
      [`${FY}E 增速`, fmtSignedPct(d.g)],
      ["个股增速中位数", fmtSignedPct(d.gmed)],
      [`剔除 ${d.maxco || "—"}`, fmtSignedPct(d.gex)],
      [`${BY}E → ${FY}E`, `${fmtNum(d.np0)} → ${fmtNum(d.np1)} 亿`],
      ["扭亏贡献占比", fmtPct(d.turn)],
      ["预测家数 / 覆盖率", `${d.nf} / ${fmtPct(d.cov, 0)}`],
    ]);
  });
}

/* ---------- revision chart ---------- */
function renderRevision() {
  const el = document.getElementById("revChart");
  const width = sizeOf(el);
  const get = d => d.rev[revWindow] ? d.rev[revWindow].r : null;
  const rows = [...DATA.industries].sort((a, b) => (get(b) ?? -Infinity) - (get(a) ?? -Infinity));
  const vals = rows.map(get).filter(v => v != null);
  const m = Math.max(0.02, ...vals.map(Math.abs));
  const ticks = niceTicks(-m, m, 4);
  const lo = Math.min(-m, ticks[0]), hi = Math.max(m, ticks[ticks.length - 1]);
  const x = v => LABEL_W + (v - lo) / (hi - lo) * (width - LABEL_W - RIGHT);
  const height = TOP + rows.length * ROW + 4;
  const digits = hi < 0.05 ? 1 : 0;

  let s = axis(null, x, ticks, height, t => (t > 0 ? "+" : "") + (t * 100).toFixed(digits) + "%");
  rows.forEach((d, i) => {
    const y = TOP + i * ROW, by = y + (ROW - BAR) / 2, v = get(d);
    s += `<text x="${LABEL_W - 8}" y="${y + ROW / 2 + 4}" text-anchor="end">${esc(d.name)}</text>`;
    if (v == null) {
      const amt = d.rev[revWindow] && d.rev[revWindow].amt;
      s += `<text class="val" x="${x(0) + 6}" y="${y + ROW / 2 + 4}">合计非正，修正额 ${amt == null ? "—" : (amt > 0 ? "+" : "") + fmtNum(amt, 1) + " 亿"}</text>`;
    } else {
      s += `<path d="${barPath(x(0), x(v), by, BAR)}" fill="${v >= 0 ? "var(--up)" : "var(--down)"}"/>`;
    }
    s += `<rect class="hit" data-i="${d.name}" x="0" y="${y}" width="${width}" height="${ROW}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" height="${height}" role="img" aria-label="${FY}E 预期修正">${s}</svg>`;
  const wd = DATA.windowDates[revWindow];
  document.getElementById("revHint").textContent =
    `配对样本预测利润合计变化，对比 ${wd || revWindow + "前"}；同一批股票前后对比`;
  bindHover(el, name => {
    const d = DATA.industries.find(r => r.name === name), r = d.rev[revWindow] || {};
    return tipHtml(`${d.name} · ${revWindow}`, [
      ["预期修正", fmtSignedPct(r.r)],
      ["修正额", r.amt == null ? "—" : (r.amt > 0 ? "+" : "") + fmtNum(r.amt, 1) + " 亿"],
      ["上调 / 下调家数", `${r.up ?? "—"} / ${r.down ?? "—"}`],
      ["上调净占比", fmtSignedPct(r.net, 0)],
      ["配对样本家数", r.n ?? "—"],
    ]);
  });
}

function renderSwitch() {
  const box = document.getElementById("revSwitch");
  box.innerHTML = W.map(w => `<button type="button" data-w="${esc(w)}" class="${w === revWindow ? "active" : ""}">${esc(w)}</button>`).join("");
  box.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    revWindow = b.dataset.w;
    renderSwitch();
    renderRevision();
  };
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function tipHtml(title, rows) {
  return `<b>${esc(title)}</b>` + rows.map(([k, v]) => `<div class="r"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
}
function bindHover(el, html) {
  el.onmousemove = e => {
    const t = e.target.closest(".hit");
    if (!t) { tip.style.display = "none"; return; }
    tip.innerHTML = html(t.dataset.i);
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = e.clientX + 14, top = e.clientY + 14;
    if (left + w > window.innerWidth - 8) left = e.clientX - w - 14;
    if (top + h > window.innerHeight - 8) top = e.clientY - h - 14;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.max(8, top) + "px";
  };
  el.onmouseleave = () => { tip.style.display = "none"; };
  el.onclick = e => {
    const t = e.target.closest(".hit");
    if (!t) return;
    openRows.add(t.dataset.i);
    renderTable();
    const row = document.querySelector(`tr.row[data-name="${CSS.escape(t.dataset.i)}"]`);
    if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

/* ---------- table ---------- */
function columns() {
  const cols = [
    { key: "name", label: "行业", cls: "l", get: d => d.name },
    { key: "flags", label: "提示", cls: "l", get: d => d.flags.length, fmt: d => d.flags.map(f => `<span class="chip">${esc(f)}</span>`).join("") || "" },
    { key: "g", label: `${FY}E增速`, get: d => d.g, fmt: d => fmtSignedPct(d.g) },
    { key: "gmed", label: "个股中位数", get: d => d.gmed, fmt: d => fmtSignedPct(d.gmed) },
    { key: "gex", label: "剔除最大增量公司", get: d => d.gex, fmt: d => fmtSignedPct(d.gex) },
    { key: "pe", label: `${FY}E PE`, get: d => d.pe, fmt: d => fmtX(d.pe) },
    { key: "np1", label: `${FY}E净利润(亿)`, get: d => d.np1, fmt: d => fmtNum(d.np1) },
    { key: "delta", label: "增量(亿)", get: d => d.delta, fmt: d => fmtNum(d.delta) },
  ];
  for (const w of W) {
    cols.push({ key: "rev_" + w, label: `修正 ${w}`, get: d => d.rev[w] && d.rev[w].r,
      fmt: d => { const v = d.rev[w] && d.rev[w].r; return v == null ? "—" : `${v > 0 ? "▲" : v < 0 ? "▼" : ""} ${fmtSignedPct(v)}`; } });
  }
  cols.push(
    { key: "net", label: `净上调占比 ${W[0]}`, get: d => d.rev[W[0]] && d.rev[W[0]].net, fmt: d => fmtSignedPct(d.rev[W[0]] && d.rev[W[0]].net, 0) },
    { key: "turn", label: "扭亏贡献", get: d => d.turn, fmt: d => fmtPct(d.turn, 0) },
    { key: "top3", label: `前${DATA.topN}占比`, get: d => d.top3, fmt: d => fmtPct(d.top3, 0) },
    { key: "cov", label: "市值覆盖率", get: d => d.cov, fmt: d => fmtPct(d.cov, 0) },
    { key: "nf", label: "预测家数", get: d => d.nf, fmt: d => `${d.nf} / ${d.n}` },
  );
  return cols;
}

function detailHtml(d, span) {
  const facts = [
    d.maxco ? `增量最大：<b>${esc(d.maxco)}</b>，贡献 <b>${fmtPct(d.maxshare, 0)}</b>，剔除后增速 <b>${fmtSignedPct(d.gex)}</b>` : "",
    `扭亏贡献 <b>${fmtPct(d.turn, 0)}</b>`,
    d.oneoff && d.oneoff.names ? `基期偏高：<b>${esc(d.oneoff.names)}</b>（基期利润占 ${fmtPct(d.oneoff.share, 0)}），剔除后增速 <b>${fmtSignedPct(d.oneoff.g)}</b>` : "",
    `前${DATA.topN}大：${esc(d.top3names || "—")}（${fmtPct(d.top3, 0)}）`,
    `平均覆盖机构 ${d.inst == null ? "—" : d.inst.toFixed(1)} 家`,
  ].filter(Boolean).join("；");
  const head = ["公司", `${BY}E(亿)`, `${FY}E(亿)`, "增量(亿)", "增速", `${FY}E PE`, ...W.map(w => `修正 ${w}`)];
  const body = d.stocks.map(s => `<tr><td class="l">${esc(s.name)} <span style="color:var(--muted)">${esc(s.code)}</span></td>
    <td>${fmtNum(s.np0, 1)}</td><td>${fmtNum(s.np1, 1)}</td><td>${fmtNum(s.delta, 1)}</td>
    <td>${s.np0 != null && s.np0 <= 0 ? "扭亏" : fmtSignedPct(s.g)}</td><td>${fmtX(s.pe)}</td>
    ${W.map(w => `<td>${fmtSignedPct(s.rev[w])}</td>`).join("")}</tr>`).join("");
  return `<tr class="detail"><td colspan="${span}"><div class="detail">
    <p class="detail-facts">${facts}</p>
    <div class="table-wrap"><table><thead><tr>${head.map((h, i) => `<th class="${i ? "" : "l"}">${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="hint" style="color:var(--muted);font-size:12px;margin:6px 0 0">按增量绝对值排序，前 ${d.stocks.length} 家</p>
  </div></td></tr>`;
}

function renderTable() {
  const cols = columns();
  const col = cols.find(c => c.key === sortKey) || cols[2];
  const rows = [...DATA.industries].sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return (typeof va === "string" ? va.localeCompare(vb, "zh-CN") : va - vb) * sortDir;
  });
  const head = `<thead><tr>${cols.map(c => `<th class="${c.cls || ""} ${c.key === sortKey ? "sorted" : ""}" data-k="${c.key}">${esc(c.label)}${c.key === sortKey ? (sortDir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>`;
  const body = rows.map(d => {
    const open = openRows.has(d.name);
    const cells = cols.map((c, i) => {
      if (i === 0) return `<td class="name"><span class="caret">${open ? "▾" : "▸"}</span>${esc(d.name)}</td>`;
      const text = c.fmt ? c.fmt(d) : esc(c.get(d));
      return `<td class="${c.cls || ""} ${text === "—" ? "na" : ""}">${text}</td>`;
    }).join("");
    return `<tr class="row ${open ? "open" : ""}" data-name="${esc(d.name)}">${cells}</tr>` + (open ? detailHtml(d, cols.length) : "");
  }).join("");
  const table = document.getElementById("table");
  table.innerHTML = head + `<tbody>${body}</tbody>`;
  table.querySelectorAll("thead th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = k === "name" ? 1 : -1; }
    renderTable();
  });
  table.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => {
    const n = tr.dataset.name;
    openRows.has(n) ? openRows.delete(n) : openRows.add(n);
    renderTable();
  });
}

function renderNotes() {
  document.getElementById("notes").innerHTML = DATA.notes.map(n => `<li>${esc(n)}</li>`).join("");
}

function renderCharts() { renderGrowth(); renderRevision(); }

renderHeader();
renderSwitch();
renderCharts();
renderTable();
renderNotes();
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderCharts, 120); });
</script>
</body>
</html>
